# Goal Maker v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "DICE SLOT TRIP MISSION and SLOT UI"
  slug: "dice-slot-trip-mission-slot-ui"
  kind: specific
  tranche: "Audit and implement the Cairo-baseline MISSION and SLOT reach wireframes."
  status: done

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true

agents:
  scout: installed
  worker: installed
  judge: installed

active_task: null

tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: medium
    objective: "Audit the current MISSION/save model and SLOT reach/result UI separately, and propose the smallest compatible implementation slice for the supplied wireframes."
    inputs:
      - "scripts/game/v06_play_session.gd"
      - "scripts/app/v06_play_screen.gd"
      - "scenes/app/V06PlayScreen.tscn"
      - "tests/run_v06_mission_tests.gd"
      - "tests/run_v06_candidate_mission_tests.gd"
      - "tests/run_v06_play_screen_tests.gd"
      - "User-supplied MISSION and SLOT wireframes in the current conversation"
    constraints:
      - "Read-only; do not edit files."
      - "Use concrete symbols, nodes, and tests."
      - "Do not repeat the prior four-lane audit except where needed for this tranche."
    expected_output:
      - "MISSION state/save/migration findings and test plan"
      - "SLOT reach/result UI findings and test plan"
      - "Ambiguities and recommended bounded worker files"
    receipt:
      result: done
      note: "notes/T001-luna-audit.md"
      summary: "Two read-only Luna lanes mapped the three-mission schema2/save behavior and the existing two-roll reach/result UI; both confirmed the wireframe gaps and identified the legacy-save and reward ambiguities."
      evidence:
        - "scripts/game/v06_play_session.gd"
        - "scripts/game/v06_session_save_data.gd"
        - "scripts/app/v06_play_screen.gd"
        - "scenes/app/V06PlayScreen.tscn"
        - "tests/run_v06_mission_tests.gd"
        - "tests/run_v06_play_screen_tests.gd"
  - id: T002
    type: pm
    assignee: PM
    status: done
    reasoning_hint: high
    objective: "Integrate T001 into exact implementation decisions, including reward copy, one-mission behavior, double-chance rules, save compatibility, and allowed files."
    inputs:
      - "T001 receipt and notes"
      - "Current dirty diff"
      - "User-supplied MISSION and SLOT wireframes"
    constraints:
      - "Do not implement."
      - "Prefer a coherent bounded slice over broad economy redesign."
      - "Keep old schema2 saves restorable and do not award retroactive mission rewards."
    expected_output:
      - "Adopted and deferred rules"
      - "Exact Worker objective and allowed_files"
      - "Verification and stop conditions"
    receipt:
      result: done
      note: "notes/T002-integration-decision.md"
      summary: "Approved a one-mission new-lap state with optional schema2 fields and legacy-save mode, truthful normal SLOT coin rewards 1/3/5, full-HP REST skill charge, single-card MISSION UI, and compact reach/double-chance guidance; deferred broader economy and Kyoto redesign."
      evidence:
        - "notes/T001-luna-audit.md"
        - "scripts/game/v06_play_session.gd"
        - "scripts/app/v06_play_screen.gd"
        - "scenes/app/V06PlayScreen.tscn"
  - id: T003
    type: worker
    assignee: Worker
    status: done
    reasoning_hint: low
    objective: "Implement the adopted one-mission MISSION and normal SLOT reach/reward slice, with optional schema2 save fields and focused regression coverage, exactly as described in notes/T002-integration-decision.md."
    allowed_files:
      - "locale/dice_slot_trip.en.po"
      - "locale/dice_slot_trip.ja.po"
      - "scripts/game/v06_play_session.gd"
      - "scripts/game/v06_session_save_data.gd"
      - "scripts/app/v06_play_screen.gd"
      - "scenes/app/V06PlayScreen.tscn"
      - "tests/run_v06_boss_play_screen_tests.gd"
      - "tests/run_v06_candidate_mission_tests.gd"
      - "tests/run_v06_coin_economy_tests.gd"
      - "tests/run_v06_mission_tests.gd"
      - "tests/run_v06_save_tests.gd"
      - "tests/run_v06_play_session_tests.gd"
      - "tests/run_v06_tile_effect_tests.gd"
      - "tests/run_v06_play_screen_tests.gd"
    verify:
      - "git diff --check -- scripts/game/v06_play_session.gd scripts/game/v06_session_save_data.gd scripts/app/v06_play_screen.gd scenes/app/V06PlayScreen.tscn tests/run_v06_candidate_mission_tests.gd tests/run_v06_mission_tests.gd tests/run_v06_save_tests.gd tests/run_v06_play_session_tests.gd tests/run_v06_tile_effect_tests.gd tests/run_v06_play_screen_tests.gd"
      - "Godot 4.7 headless editor parse"
      - "Focused mission, candidate mission, save, play-session, tile-effect, and play-screen tests"
      - "No new failure beyond the known play-screen QA route-score baseline red"
    stop_if:
      - "Need files outside the PM-approved allowed_files."
      - "A new regression appears in the required test set."
      - "The implementation would require a broad economy, CASINO CHIP, or Kyoto boss redesign."
    receipt:
      result: done
      note: "notes/T003-implementation-receipt.md"
      changed_files:
        - "locale/dice_slot_trip.en.po"
        - "locale/dice_slot_trip.ja.po"
        - "scripts/game/v06_play_session.gd"
        - "scripts/game/v06_session_save_data.gd"
        - "scripts/app/v06_play_screen.gd"
        - "tests/run_v06_boss_play_screen_tests.gd"
        - "tests/run_v06_candidate_mission_tests.gd"
        - "tests/run_v06_coin_economy_tests.gd"
        - "tests/run_v06_mission_tests.gd"
        - "tests/run_v06_play_screen_tests.gd"
        - "tests/run_v06_play_session_tests.gd"
        - "tests/run_v06_save_tests.gd"
        - "tests/run_v06_tile_effect_tests.gd"
      summary: "Implemented one selected Cairo mission per lap with explicit target copy, TRIP COIN reward/progress state, optional schema2 save fields with legacy mode, full-HP REST SKILL charge, normal SLOT coin rewards 1/3/5, compact two-line reach guidance, primary and PAIR-insurance double chance copy, and regression coverage while preserving the existing coin utility slice."
      commands:
        - cmd: "git diff --check"
          status: pass
        - cmd: "Godot 4.7 headless editor parse"
          status: pass
        - cmd: "candidate mission, mission/save migration, save, play-session, tile-effect, coin-economy, boss battle, and boss play-screen suites"
          status: "pass; failures=0"
        - cmd: "play-screen suite"
          status: "new MISSION/SLOT/coin assertions pass; one unchanged QA route-score baseline failure remains"
      known_baseline:
        - "tests/run_v06_play_screen_tests.gd: QA route scores exactly its seventeen travelled spaces while coin stays separate"
  - id: T004
    type: worker
    assignee: Worker
    status: done
    reasoning_hint: low
    objective: "Gate normal SLOT TRIP COIN rewards and normal selected-role MISSION progress so boss-role resolution records role statistics without granting the normal-map reward; add a focused boss regression test."
    allowed_files:
      - "scripts/game/v06_play_session.gd"
      - "tests/run_v06_coin_economy_tests.gd"
      - "tests/run_v06_play_session_tests.gd"
    verify:
      - "git diff --check -- scripts/game/v06_play_session.gd tests/run_v06_play_session_tests.gd"
      - "Godot 4.7 headless editor parse"
      - "run_v06_play_session_tests.gd with the new boss reward guard assertion"
      - "run_v06_mission_tests.gd and run_v06_coin_economy_tests.gd"
    stop_if:
      - "Need files outside the two approved files."
      - "Normal-map PAIR/STRAIGHT/TRIPLE rewards or selected-role MISSION progress regress."
      - "The change requires boss redesign or broader economy changes."
    receipt:
      result: done
      note: "notes/T004-boss-reward-guard.md"
      changed_files:
        - "scripts/game/v06_play_session.gd"
        - "tests/run_v06_coin_economy_tests.gd"
        - "tests/run_v06_play_session_tests.gd"
      summary: "Separated boss role statistics from normal-map SLOT rewards: boss resolution no longer grants PAIR/STRAIGHT/TRIPLE TRIP COIN or advances the selected normal role/coin MISSION, while normal role rewards remain unchanged. Added a deterministic boss regression assertion and restored the coin-economy fixture to the no-cashout contract."
      commands:
        - cmd: "git diff --check -- scripts/game/v06_play_session.gd tests/run_v06_coin_economy_tests.gd tests/run_v06_play_session_tests.gd"
          status: pass
        - cmd: "Godot 4.7 headless editor parse"
          status: pass
        - cmd: "tests/run_v06_play_session_tests.gd"
          status: "pass; failures=0"
        - cmd: "tests/run_v06_mission_tests.gd and tests/run_v06_coin_economy_tests.gd"
          status: "pass; failures=0"
  - id: T999
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Audit whether the implemented MISSION/SLOT wireframe tranche is complete and verified."
    inputs:
      - "All done task receipts"
      - "Last verification"
      - "Current dirty diff"
    constraints:
      - "Do not implement."
      - "Reject completion if a required Worker remains queued or active."
    expected_output:
      - "complete | not_complete"
      - "Missing evidence"
      - "Next task if not complete"
    receipt:
      result: complete
      decision: complete
      summary: "Approved the MISSION/SLOT wireframe tranche after T004 corrected boss-role reward scope. Boss roles record statistics only; normal-map PAIR/STRAIGHT/TRIPLE rewards remain +1/+3/+5 and normal selected-role mission progress is preserved."
      evidence:
        - "T003 and T004 implementation receipts cover the single featured mission, explicit target-role copy, optional schema2 save fields with legacy mode, REST/SKILL behavior, compact reach/double-chance/PAIR insurance copy, and reward scope."
        - "Focused candidate mission, mission/save migration, save, play-session, tile-effect, coin-economy, boss battle, and boss play-screen suites pass with failures=0."
        - "The play-screen suite has only the documented pre-existing QA route-score baseline failure; all new MISSION/SLOT/coin assertions pass."
      missing_evidence: []
      next_task: null

verification:
  status: pass_with_known_baseline_failure
  checked_at: "2026-08-16"
  commands:
    - "git diff --check: pass"
    - "Godot 4.7 headless editor parse: pass"
    - "run_v06_candidate_mission_tests.gd: failures=0"
    - "run_v06_mission_tests.gd: failures=0"
    - "run_v06_save_tests.gd: failures=0"
    - "run_v06_play_session_tests.gd: failures=0"
    - "run_v06_tile_effect_tests.gd: failures=0"
    - "run_v06_coin_economy_tests.gd: failures=0"
    - "run_v06_boss_battle_tests.gd: failures=0"
    - "run_v06_boss_play_screen_tests.gd: failures=0"
    - "run_v06_play_screen_tests.gd: new assertions pass; one unchanged QA route-score baseline failure"
  failures:
    - "Known baseline: tests/run_v06_play_screen_tests.gd — QA route scores exactly its seventeen travelled spaces while coin stays separate"
