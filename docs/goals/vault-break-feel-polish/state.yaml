        - "C:/tmp/vault-break-feel-recovery-final2-720"
      limitation: "The shipped game remains its existing one-die-per-roll flow; DISCARD receives immediate tactile confirmation without adding selection state."

  - id: T020
    type: pm
    assignee: PM
    status: done
    objective: "Run focused model/UI regressions and real-render feel QA at 360x800 and 720x1280, including last roll, success, denied, and safe teardown."
    inputs:
