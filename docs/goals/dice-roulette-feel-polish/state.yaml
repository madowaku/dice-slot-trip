version: 2
goal:
  title: "DICE ROULETTE FEEL POLISH"
  slug: dice-roulette-feel-polish
  mode: specific
  status: done
  active_task: null
  summary: "Make the fixed Roulette result compelling through a paced WHERE then BOOST reveal without changing gameplay or economy."
  constraints:
    - "Presentation, sound, haptics, display timing, and teardown safety only"
    - "No WHERE/BOOST logic, BET, payout, RTP, RNG, CasinoBank, save, BGM, route, or CHANGE BET changes"
    - "Preserve 360x800 and 720x1280 layouts and existing result CTA structure"

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true

agents:
  scout: installed
  worker: installed
  judge: installed

active_task: null

