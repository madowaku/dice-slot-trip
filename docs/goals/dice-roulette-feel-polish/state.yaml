        - "SPIN validates, locks phase, rolls red/blue, persists both pending rolls with the atomic BET charge, pure-resolves, then awaits presentation."
        - "Current presentation is a 1.18/1.38 second single QUART ease-out, WHERE-only 0.38 second hold, combined WHERE+BOOST 0.42 second hold, settlement, instant payout display, then CTA."
        - "Resume pure-resolves stored pending rolls and replays presentation without another charge; settlement receipts prevent duplicate credit."
      decisions:
        - "Keep RNG count/order, begin_game persistence, pure result, and settlement semantics unchanged."
        - "Wheel owns a tracked accelerate/cruise/decelerate/linger tween landing on pre-resolved slots; Screen owns staged WHERE, BOOST, result, and CHIP presentation."
        - "Use CasinoFeelFX for generic press, land, haptics, result, and balance only; keep Roulette cues local."
        - "Treat LUCKY_7 and JACKPOT as special WHERE; treat BOOST >=2.0 as high, with face 6 remaining MAX."
      fixtures:
        - "Normal win: HIGH10, red slot1 face3, blue slot14 face1 => RETURN17 NET+7."
        - "Special WHERE loss: HIGH10, red slot11 LUCKY_7 face2, blue slot14 face1 => RETURN0 NET-10."
        - "High BOOST win: HIGH10, red slot1 face6, blue slot14 face2 => RETURN42 NET+32."
        - "Normal loss: HIGH10, red slot14 face3, blue slot6 face4 => RETURN0 NET-10."
