version: 2
goal:
  title: "DICE TOWER FEEL POLISH"
  slug: dice-tower-feel-polish
  mode: specific
  status: done
  active_task: null
  summary: "Make DICE TOWER feel responsive and rewarding without changing gameplay or economy."
  constraints:
    - "Presentation, sound, tactility, and timing only"
    - "No rules, probability, BET, payout, BUST, save, economy, or route changes"
    - "DICE TOWER only; VAULT BREAK and DICE ROULETTE are deferred"
    - "Preserve Japanese-first labels, touch targets, and 360x800/720x1280 fit"

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true

agents:
  scout: installed
  worker: installed
  judge: installed

active_task: null

tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: done
    objective: "Map the existing DICE TOWER roll, result, audio, haptic, and deterministic QA surfaces and identify the smallest safe feel slice."
    inputs:
      - "scripts/app/dice_tower_screen.gd"
      - "scripts/game/dice_tower_model.gd"
      - "scripts/game/dice_presentation_3d.gd"
      - "autoload/ui_sfx_manager.gd"
      - "scripts/ui/v06_feedback_controller.gd"
      - "tests/record_dice_tower.gd"
      - "tests/run_casino_ui_tests.gd"
    constraints:
      - "Read-only investigation"
      - "Do not expand scope to other casino facilities"
    expected_output:
      - "Current event/timing map"
      - "Available audio and haptic primitives"
      - "Safe allowed_files list for one Worker"
      - "Concrete verification commands and stop conditions"
    receipt:
      result: done
      summary: "DICE TOWER has deterministic pending-roll animation and semantic UI cues but no dedicated feel base or haptics. The smallest safe slice is a new CasinoFeelFX helper plus tower-only presentation wiring; keep the existing 0.75s roll and 0.32s settle timing unless tests prove otherwise."
      evidence:
        - "scripts/app/dice_tower_screen.gd"
        - "scripts/game/dice_tower_model.gd"
        - "scripts/game/dice_presentation_3d.gd"
        - "autoload/ui_sfx_manager.gd"
        - "scripts/game/dice_audio_controller.gd"
        - "scripts/ui/v06_feedback_controller.gd"
        - "tests/run_casino_ui_tests.gd"
        - "tests/record_dice_tower.gd"
      decisions:
        - "Use existing dice WAV assets and arcade semantic cues; requested dedicated cue names do not exist in the current asset pack."
        - "Use container-safe offset_transform_scale for button/result/floor punches and offset_transform_position for tower jerk/shake."
        - "Do not edit dice_tower_model.gd, casino_bank.gd, routes, or BGM tempo."
      allowed_files_for_worker:
        - "scripts/app/dice_tower_screen.gd"
        - "scripts/ui/casino_feel_fx.gd"
        - "scripts/ui/casino_feel_fx.gd.uid"
        - "tests/record_dice_tower.gd"
      verify:
        - "Godot headless editor validation"
        - "tests/run_casino_ui_tests.gd"
        - "tests/record_dice_tower.gd at 360x800 and 720x1280 real render"
        - "git diff --check"
  - id: T010
    type: worker
    assignee: Worker
    status: done
    objective: "Implement the bounded DICE TOWER feel layer selected from T001, keeping all gameplay and persistence logic unchanged."
    allowed_files:
      - "scripts/app/dice_tower_screen.gd"
      - "scripts/ui/casino_feel_fx.gd"
      - "scripts/ui/casino_feel_fx.gd.uid"
      - "tests/record_dice_tower.gd"
    verify:
      - "Godot headless editor validation"
      - "tests/run_casino_ui_tests.gd"
      - "tests/record_dice_tower.gd at 360x800 and 720x1280 real render"
      - "git diff --check"
    stop_if:
      - "Need to edit a file outside allowed_files"
      - "A change would alter model outcomes, payouts, persistence, economy, or routes"
      - "Verification fails twice for the same reason"
    receipt:
      result: done
      changed_files:
        - "scripts/app/dice_tower_screen.gd"
        - "scripts/ui/casino_feel_fx.gd"
        - "scripts/ui/casino_feel_fx.gd.uid"
      commands:
