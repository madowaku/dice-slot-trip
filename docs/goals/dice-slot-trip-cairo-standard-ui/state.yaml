        - "scripts/game/v06_play_session.gd"
        - "scripts/game/v06_session_save_data.gd"
        - "scripts/app/v06_play_screen.gd"
        - "scenes/app/V06PlayScreen.tscn"
        - "data/stages/v06_cairo_course.json"
        - "tests/run_v06_play_screen_tests.gd"
  - id: T002
    type: pm
    assignee: PM
    status: done
    reasoning_hint: high
    objective: "Integrate T001 into an exact first implementation slice, with pure next-one-roll candidate rules, mission selection/save compatibility, UI ownership, and explicit deferrals."
    inputs:
      - "T001 four-lane receipt"
      - "Current Cairo V06 source and tests"
      - "User-supplied final core UI specification"
    constraints:
      - "Do not implement."
      - "Preserve the completed MISSION/SLOT tranche and known baseline."
      - "Prefer a reversible vertical slice with strong 360x640 and save tests."
    expected_output:
      - "Adopted mission pool/weights/reward rules"
      - "Exact candidate conflict precedence and copy contract"
      - "Exact Worker allowed_files, verify commands, stop_if, and deferred work"
    receipt:
      result: done
      note: "notes/T002-pm-integration-decision.md"
      summary: "Fixed the first 12 stable mission rows and 8/12/18 rewards, adopted deterministic lap-bucket selection and schema-2 compatibility, and defined a pure neutral two-line candidate contract. Deferred coordinate changes and the full V06CourseModel MAP preview until their own verified slice."
