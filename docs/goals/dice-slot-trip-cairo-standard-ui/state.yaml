# Goal Maker v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "DICE SLOT TRIP Cairo Standard Core UI v1.0"
  slug: "dice-slot-trip-cairo-standard-ui"
  kind: specific
  tranche: "Integrate the final MISSION/SLOT/ordinary-screen next-one-roll specification and implement the first safe verified slice."
  status: done

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true

agents:
  scout: installed
  worker: installed
  judge: installed

active_task: null

tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: medium
    objective: "Audit the current Cairo MISSION catalog/save model, SLOT reach model, MAP landing preview, ordinary HUD/layout, and regression coverage against the final integrated UI specification in four non-overlapping read-only lanes."
    inputs:
      - "User-supplied Cairo Standard Core UI v1.0 specification in the current conversation"
      - "Completed docs/goals/dice-slot-trip-mission-slot-ui tranche"
      - "Current dirty working tree"
    constraints:
      - "Read-only; do not edit implementation or test files."
      - "Use concrete symbols, nodes, current behavior, and test evidence."
      - "Each lane must return only its assigned evidence and bounded recommendations."
    expected_output:
      - "MISSION catalog/difficulty/round-weight/save findings"
      - "SLOT/MISSION conflict and two-line display findings"
      - "MAP landing candidate and route-preview findings"
      - "ordinary HUD/360 layout and regression-risk findings"
    receipt:
      result: done
      note: "notes/T001-luna-audit.md"
      summary: "Four read-only Luna lanes audited the current mission/save model, SLOT conflict copy, authoritative course preview path, and 360x640 ordinary-screen layout. The runtime foundation is safe, but the 12-row weighted catalog, pure candidate contract, and six-distance MAP preview remain to be implemented in bounded slices."
