version: 2

goal:
  title: "CASINO FEEL FINAL QA"
  slug: casino-feel-final-qa
  kind: audit
  tranche: "Update stale Race UI assertions, run six-facility individual and continuous-tour QA at both target resolutions, fix only HIGH/MEDIUM findings, and obtain CASINO_FEEL_FINAL_PASS."
  status: done

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true

agents:
  scout: installed
  worker: installed
  judge: installed

active_task: null

tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: high
    objective: "Map the exact stale Race assertions, all six feel suites/recorders, CasinoBank fixture/restore APIs, HUB route order, audio/teardown hooks, and the smallest deterministic Phase 5G test boundary."
    inputs:
      - "tests/run_casino_ui_tests.gd"
      - "tests/run_*casino*_tests.gd"
      - "tests/run_dice_*_tests.gd"
      - "tests/run_vault_break*_tests.gd"
      - "tests/run_treasure_21_tests.gd"
      - "tests/record_*feel.gd"
      - "scripts/app/casino_hub_screen.gd"
      - "scripts/game/casino_bank.gd"
    constraints:
      - "Read-only; do not edit files."
      - "Identify evidence and exact commands, not speculative redesign."
      - "Preserve all protected gameplay/economy/save/BGM/HUB route behavior."
    expected_output:
      - "Exact legacy Race assertion update scope"
      - "Six-facility and casino-tour coverage map"
      - "Fixture restore and teardown strategy"
      - "Allowed files, verification commands, and stop conditions"
    receipt:
      result: done
      summary: "The smallest complete boundary is to update the stale asynchronous Race result assertions, add a test-only six-facility final harness/recorder, and touch no gameplay/economy/scene/BGM behavior."
      evidence:
        - "tests/run_casino_ui_tests.gd:220,270-315 contain the 13 stale/cascade Race failures; current result contract is scripts/app/dice_race_screen.gd:1211-1313."
        - "Existing dedicated suites cover Race 25, Vault model/UI, Poker 97, Roulette 110, Treasure 100; Tower is covered by Casino model/UI suites."
        - "All QA can use process-specific CasinoBank test save paths with 300 CHIP; production save safety is proven by before/after SHA-256 equality."
        - "Existing HUB source order is race, tower, roulette, treasure, poker, vault and is protected by foundation/expansion tests."
        - "Each facility has a recorder; Phase 5G needs one cross-facility tour/restore/teardown harness and two-resolution evidence."
      allowed_files:
        - "tests/run_casino_ui_tests.gd"
        - "tests/run_casino_feel_final_tests.gd"
        - "tests/run_casino_feel_final_tests.gd.uid"
        - "tests/record_casino_feel_final.gd"
        - "tests/record_casino_feel_final.gd.uid"
        - "docs/goals/casino-feel-final-qa/**"
        - "scripts/app/casino_hub_screen.gd only if residual shared SE is reproduced"
      stop_if:
        - "Any protected model/economy/save/BGM selection/HUB count/route change is required."
        - "Do not fabricate subjective player answers; separate recorded evidence from subjective LOW notes."
      ambiguity:
        - "The pasted desired order conflicts with the actual protected HUB order. Phase 5G should follow the actual UI order; reordering is a separate product change."

  - id: T002
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Review the Scout receipt and approve the smallest complete Phase 5G implementation/QA boundary."
    inputs:
      - "T001 receipt"
      - "Phase 5G specification"
    constraints:
      - "Read-only; do not implement."
      - "Require normal Casino regression 0 failures before final QA."
    expected_output:
      - "Decision"
      - "Exact Worker objective"
      - "allowed_files"
      - "verify"
      - "stop_if"
      - "Deferred LOW findings"
    receipt:
      result: done
      decision: "Approve one test-only Worker slice; no production file is currently justified."
      summary: "Modernize stale Race integration assertions without weakening settlement checks, then add deterministic Session A/Session B final QA and a two-resolution recorder. Follow the actual displayed HUB order and record the prose-table mismatch as LOW."
      next_allowed_task: T003
      allowed_files:
        - "tests/run_casino_ui_tests.gd"
        - "tests/run_casino_feel_final_tests.gd"
        - "tests/run_casino_feel_final_tests.gd.uid"
        - "tests/record_casino_feel_final.gd"
        - "tests/record_casino_feel_final.gd.uid"
      verify:
        - "run_casino_ui_tests.gd: 0 failures before continuing"
        - "run_casino_feel_final_tests.gd: 0 failures"
        - "All listed Casino/facility regressions: 0 failures"
        - "Real GPU recorder at 360x800 and 720x1280 with non-empty PNGs and stage-log"
        - "Production save SHA-256 unchanged, fixture removed, no Godot process"
      stop_if:
