      - "run_casino_ui_tests.gd and run_casino_feel_final_tests.gd: 0 failures"
      - "Production save hash unchanged and test fixture removed"
      - "git diff --check and no Godot process"
    stop_if:
      - "Need files outside allowed_files."
      - "Any probability, BET, payout, RTP, Bank rule, save format, BGM selection, HUB count, or route change is required."
      - "Fixture restore/hash cannot be proven or the same verification failure repeats twice."
    receipt:
      result: blocked
      changed_files:
        - "tests/run_casino_ui_tests.gd"
      summary: "Worker modernized the stale Race result assertions and CTA route, then hit its external usage limit before verification or the final harness/recorder could be created. PM recovery will inspect and finish the same bounded scope."
      remaining:
