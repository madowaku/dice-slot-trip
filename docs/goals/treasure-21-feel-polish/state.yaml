version: 2

goal:
  title: "TREASURE 21 FEEL POLISH"
  slug: treasure-21-feel-polish
  kind: specific
  tranche: "Map the existing Treasure21 flow, implement the first bounded presentation-only feel slice, verify it at both target resolutions, and audit the protected diff."
  status: done

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true

agents:
  scout: installed
  worker: installed
  judge: installed

active_task: null

tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: medium
    objective: "Map the current Treasure21 result resolution, settlement order, UI nodes, chest/preview assets, CasinoFeelFX hooks, deterministic fixtures, and teardown risks; recommend the smallest safe Phase 5D boundary."
    inputs:
      - "scripts/app/treasure_21_screen.gd"
      - "scripts/game/treasure_21_model.gd"
      - "scenes/casino/Treasure21.tscn"
      - "scripts/ui/casino_feel_fx.gd"
      - "tests/run_treasure_21_tests.gd"
      - "tests/record_treasure_21_product_ui.gd"
      - "tests/run_casino_ui_tests.gd"
      - "tests/run_casino_expansion_ui_tests.gd"
    constraints:
      - "Read-only investigation; do not edit implementation files."
      - "Do not change gameplay, economy, persistence, BGM, routes, or other facilities."
      - "Use concrete file-path and line-range evidence."
    expected_output:
      - "Current event/timing/state/settlement map"
      - "Exact safe presentation and teardown plan"
      - "Exact allowed_files, verify commands, and stop conditions"
      - "Deterministic fixtures for <17, SAFE, 18/19, ONE AWAY, TREASURE, CASH OUT, BUST, and preview refresh"
    receipt:
      result: done
      summary: "Treasure21 is entirely runtime-built in treasure_21_screen.gd; the current flow persists/charges before a short roll animation, applies the fixed model result, settles immediately, then shows an undifferentiated result reveal. Presentation needs TOTAL/chest/status staging, CasinoFeelFX hooks, and explicit exit cleanup while model/Bank/scene/BGM/routes remain untouched."
      evidence:
        - "scripts/app/treasure_21_screen.gd:610-780"
        - "scripts/app/treasure_21_screen.gd:834-1001"
        - "scripts/game/treasure_21_model.gd:111-188"
        - "scripts/ui/casino_feel_fx.gd:33-114"
        - "tests/run_treasure_21_tests.gd:150-248"
        - "tests/record_treasure_21_product_ui.gd:27-127"
      safe_boundary:
        allowed_files:
          - "scripts/app/treasure_21_screen.gd"
          - "scripts/ui/casino_feel_fx.gd (only if an essential reusable cue is missing)"
          - "tests/run_treasure_21_tests.gd"
          - "tests/record_treasure_21_product_ui.gd"
          - "tests/record_treasure_21_feel.gd (optional new recorder)"
        protected:
          - "scripts/game/treasure_21_model.gd"
          - "scripts/game/casino_bank.gd"
          - "BGM, scene, route, and other facility files"
      verification:
        - "Godot 4.7 headless Treasure21 suite"
        - "Casino foundation/Casino/Casino UI/Expansion UI suites"
        - "DICE TOWER, VAULT BREAK, and DICE ROULETTE regressions"
        - "360x800 and 720x1280 real GPU recorder with stage logs"
        - "editor parse, git diff --check, protected diff, and residual process cleanup"
      fixtures:
        - "<17 / SAFE17 / 18 / 19 / ONE AWAY20"
        - "TREASURE21, CASH OUT at 17, BUST from 19+5"
        - "six-face preview refresh, repeated three games, and queue_free mid-animation"

  - id: T002
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Review the Scout receipt and select one bounded Worker slice that satisfies the highest-value Treasure21 feel requirements without touching protected logic."
    inputs:
      - "T001 receipt"
      - "Phase 5D pasted specification"
    constraints:
      - "Read-only; do not implement."
      - "Require exact allowed_files, verification commands, and stop conditions."
    expected_output:
      - "Decision"
      - "Exact Worker objective"
      - "allowed_files"
      - "verify"
      - "stop_if"
      - "Deferred risks or follow-up tasks"
    receipt:
      result: done
      decision: "approved; activate one bounded presentation-only Worker slice"
      summary: "Implement staged Treasure21 feel in the screen with existing CasinoFeelFX and UiSfx cues: lock input through presentation, animate TOTAL/current track/chest/status, keep preview visible but marked stale until confirmed refresh, sequence terminal RETURN/NET then CHIP count, and harden exit cleanup. No model, Bank, save, BGM, route, scene, asset, or shared-FX API changes."
      allowed_files:
        - "scripts/app/treasure_21_screen.gd"
        - "tests/run_treasure_21_tests.gd"
        - "tests/record_treasure_21_feel.gd"
        - "tests/record_treasure_21_feel.gd.uid"
      verify:
        - "Godot 4.7 editor parse"
        - "tests/run_treasure_21_tests.gd"
        - "Casino foundation/Casino/Casino UI/Expansion UI"
        - "VAULT BREAK model/UI, DICE ROULETTE, and UI SFX regressions"
        - "stage-aware real GPU renders at 360x800 and 720x1280"
        - "git diff --check, protected diff, temp cleanup, and no residual Godot process"
      fixtures:
        - "<17, SAFE17, 18/19, ONE AWAY20, TREASURE21, CASH OUT, BUST, preview refresh, repeat three games, mid-animation queue_free"
      stop_if:
        - "Need files/assets/API outside the allowed boundary."
        - "Any gameplay, economy, persistence, BGM, route, scene, or rule behavior changes."
        - "Duplicate input reaches model/Bank or CTA unlocks before presentation."
        - "Old preview misleads, permanent layout displaces 360x800, or queue_free causes callbacks/errors/audio."
        - "Same verification failure repeats twice."

  - id: T003
    type: worker
    assignee: Worker
    status: blocked
    reasoning_hint: medium
    objective: "Execute the bounded Treasure21 presentation-only implementation selected by Judge, with deterministic stage assertions and real-render evidence."
    allowed_files:
