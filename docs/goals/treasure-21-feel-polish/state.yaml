        - "TREASURE/CASH OUT/BUST sequencing and RETURN/NET before CHIP count"
        - "CasinoFeelFX press/dice/chip/haptic hooks and duplicate CTA coverage"
        - "Dedicated 360x800/720x1280 stage-aware recorder and deterministic evidence"

